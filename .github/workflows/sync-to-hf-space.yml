name: Sync to Hugging Face Space

# Miroir automatique de main vers le Space Hugging Face
# (https://huggingface.co/spaces/antoinechevre/accessibility), qui a son
# propre dépôt git séparé de GitHub — un simple push ici ne le met pas à
# jour tout seul. Nécessite un secret de dépôt HF_TOKEN (token Hugging Face
# avec droit d'écriture sur le Space), à ajouter dans Settings > Secrets
# and variables > Actions.
#
# Upload via l'API HTTP de huggingface_hub (upload_folder) plutôt qu'un push
# git : le protocole git contre le serveur des Spaces HF s'est révélé peu
# fiable dans les deux versions (v2 : "fatal: expected 'acknowledgments'" ;
# v0, utilisé un temps en contournement : "fatal: the remote end hung up
# unexpectedly", reproduit aussi en local donc pas spécifique au runner
# GitHub). L'API HTTP contourne entièrement le protocole git et gère
# nativement les gros fichiers (pas de limite 10 Mo à la git-plain), donc
# plus besoin non plus de vérifier la taille des fichiers à la main.
#
# Exclut les notebooks de prototypage (cf. docstring des vues sous views/) :
# pas nécessaires à l'exécution de l'app Streamlit, et leurs sorties de
# cellules (cartes intégrées) sont volumineuses sans intérêt pour le Space.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Push vers le Space Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q -U huggingface_hub
          python "${GITHUB_WORKSPACE}/.github/workflows/deploy_hf_space.py"
